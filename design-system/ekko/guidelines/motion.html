<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Spring for ticks, slow ease for the sun" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-screen);padding:20px;box-sizing:border-box;margin:0}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.c{height:64px;border-radius:14px;border:1px solid #0000000d}.n{font:var(--fw-bold) 12px/1.2 var(--font-body);margin-top:7px}.v{font:var(--fw-medium) 11px/1.3 var(--font-body);color:var(--text-3)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-3)}</style></head><body><style>@keyframes up{0%,15%{transform:translateY(60px)}60%,100%{transform:translateY(0)}}@keyframes pop{0%,40%{transform:scale(.6);opacity:0}55%{transform:scale(1.12);opacity:1}70%,100%{transform:scale(1)}}</style><div style="display:flex;gap:30px;align-items:center"><div style="width:180px;height:100px;border-radius:20px;overflow:hidden;background:var(--moss-800);position:relative"><div style="position:absolute;left:55px;top:20px;width:70px;height:70px;border-radius:50%;background:var(--sun-fill);animation:up 3s var(--ease-spring) infinite"></div><div style="position:absolute;bottom:0;left:0;right:0;height:22px;background:var(--moss-900)"></div></div><div style="width:44px;height:44px;border-radius:50%;background:var(--accent);animation:pop 2s var(--ease-spring) infinite"></div><div class="v" style="line-height:1.6">--ease-spring cubic-bezier(.34,1.56,.64,1) — checks, toggles, toasts<br>--ease-sun cubic-bezier(.65,0,.35,1) · 1200ms — sky + sun<br>--ease-out 120/250ms — hovers, presses (scale .97)</div></div></body></html>
