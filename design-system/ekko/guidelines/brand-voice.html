<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-screen);padding:20px;box-sizing:border-box;margin:0}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.c{height:64px;border-radius:14px;border:1px solid #0000000d}.n{font:var(--fw-bold) 12px/1.2 var(--font-body);margin-top:7px}.v{font:var(--fw-medium) 11px/1.3 var(--font-body);color:var(--text-3)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-3)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="background:var(--moss-100);border-radius:16px;padding:14px"><div class="lbl" style="color:var(--moss-700)">Do</div><div style="font:var(--type-label);margin-top:6px;">TikTok’s still asleep. Two steps and it’s up.</div></div><div style="background:var(--paper-200);border-radius:16px;padding:14px"><div class="lbl" style="color:var(--danger-600)">Don’t</div><div style="font:var(--type-label);margin-top:6px;color:var(--text-3)">Access denied. Complete required tasks to unlock.</div></div><div style="background:var(--moss-100);border-radius:16px;padding:14px"><div class="lbl" style="color:var(--moss-700)">Do</div><div style="font:var(--type-label);margin-top:6px;">Real life happens. Pick a way out.</div></div><div style="background:var(--paper-200);border-radius:16px;padding:14px"><div class="lbl" style="color:var(--danger-600)">Don’t</div><div style="font:var(--type-label);margin-top:6px;color:var(--text-3)">Are you sure? You will lose your progress.</div></div></div></body></html>
