<!-- @dsCard group="Brand" viewport="700x190" name="Day cycle" subtitle="The core idea: the app goes from night to sunrise" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-screen);padding:20px;box-sizing:border-box;margin:0}.sw{display:flex;gap:10px}.s{flex:1;min-width:0}.c{height:64px;border-radius:14px;border:1px solid #0000000d}.n{font:var(--fw-bold) 12px/1.2 var(--font-body);margin-top:7px}.v{font:var(--fw-medium) 11px/1.3 var(--font-body);color:var(--text-3)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-3)}</style></head><body><div style="display:flex;gap:10px"><div style="flex:1;height:150px;border-radius:20px;background:var(--moss-950);color:#fff;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between"><span style="font:750 28px/1 var(--font-display);letter-spacing:-.04em">4:00</span><span style="font:var(--type-label)">Apps fall asleep</span></div><div style="flex:1;height:150px;border-radius:20px;background:var(--moss-800);color:#fff;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between"><span style="font:750 28px/1 var(--font-display);letter-spacing:-.04em">6:40</span><span style="font:var(--type-label)">You wake up</span></div><div style="flex:1;height:150px;border-radius:20px;background:linear-gradient(180deg,#5d7a5f,#f3d6a8);color:#fff;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between"><span style="font:750 28px/1 var(--font-display);letter-spacing:-.04em">6:52</span><span style="font:var(--type-label)">Halfway there</span></div><div style="flex:1;height:150px;border-radius:20px;background:var(--yolk-100);color:var(--text-1);padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between"><span style="font:750 28px/1 var(--font-display);letter-spacing:-.04em">7:05</span><span style="font:var(--type-label)">Apps wake up</span></div></div></body></html>
